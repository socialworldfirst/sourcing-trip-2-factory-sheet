<style id="pg-style">
  /* gate tier: wf */
  :root{
    --pink:#ff0051; --pink-press:#e00047; --err:#ff7a9c; --mark:#fff;
    --plum:#13002d; --plum-2:#2a0a4d; --plum-3:#40105f;
    --ink:#fff; --mute:rgba(255,255,255,.62); --faint:rgba(255,255,255,.40);
    --line:rgba(255,255,255,.17); --field:rgba(255,255,255,.06);
    --field-focus:rgba(255,255,255,.10); --ring:rgba(255,0,81,.22);
    --card-bg:rgba(255,255,255,.055); --card-brd:rgba(255,255,255,.14);
    --card-shadow:0 40px 100px -30px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.11);
    --btn-shadow:0 8px 24px -8px rgba(255,0,81,.7);
    --foot:rgba(255,255,255,.40); --foot-a:rgba(255,255,255,.55); --content-bg:#fff;
  }
  body{background:
    radial-gradient(80% 60% at 12% 6%, var(--plum-3) 0%, rgba(64,16,95,0) 58%),
    radial-gradient(75% 60% at 90% 96%, var(--plum-2) 0%, rgba(42,10,77,0) 58%),
    var(--plum);}
  #globe{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;
    cursor:grab;touch-action:none}
  #globe.drag{cursor:grabbing}
  .gate-main{pointer-events:none}
  .card{pointer-events:auto;
    -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}
  .foot{pointer-events:auto;text-shadow:0 1px 12px rgba(0,0,0,.9)}
  @media (min-width:940px){ .gate-main{justify-items:end;padding-right:8vw} }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wm{display:block;height:auto}
  #gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden}
  .gate-main{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:24px}
  .card{width:100%;max-width:372px;background:var(--card-bg);border:1px solid var(--card-brd);
    border-radius:18px;padding:38px 34px 28px;box-shadow:var(--card-shadow)}
  @media (max-width:420px){ .card{padding:32px 24px 24px;border-radius:16px} }
  .card .wm{height:17px;color:var(--mark);margin:0 auto 26px}
  form{margin:0}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .field{position:relative}
  .field input{width:100%;height:46px;padding:0 42px 0 14px;font-family:inherit;font-size:14.5px;
    color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:11px;
    outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
  .field input::placeholder{color:var(--faint)}
  .field input:focus{border-color:var(--pink);background:var(--field-focus);
    box-shadow:0 0 0 4px var(--ring)}
  .peek{position:absolute;top:0;right:0;height:46px;width:42px;display:grid;place-items:center;
    background:none;border:0;cursor:pointer;color:var(--faint);padding:0}
  .peek:hover{color:var(--ink)}
  .peek svg{width:18px;height:18px}
  .row{display:flex;align-items:center;justify-content:space-between;margin:12px 1px 16px}
  .remember{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;
    color:var(--mute);user-select:none}
  .remember input{position:absolute;opacity:0;width:0;height:0}
  .box{width:18px;height:18px;border:1px solid var(--line);border-radius:5px;display:grid;
    place-items:center;background:var(--field);transition:all .15s}
  .remember input:checked + .box{background:var(--pink);border-color:var(--pink)}
  .box svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .12s}
  .remember input:checked + .box svg{opacity:1}
  .pg-caps{font-size:12px;opacity:0;transition:opacity .15s}
  .pg-caps.on{opacity:1;color:var(--pink)}
  button.enter{width:100%;height:46px;border:0;border-radius:11px;cursor:pointer;
    font-family:inherit;font-size:14.5px;font-weight:600;color:#fff;background:var(--pink);
    letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:var(--btn-shadow);transition:background .15s,transform .06s}
  button.enter:hover{background:var(--pink-press)}
  button.enter:active{transform:translateY(1px)}
  button.enter:disabled{opacity:.7;cursor:default}
  .spin{width:17px;height:17px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
    border-radius:50%;animation:sp .7s linear infinite;display:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  body.busy .spin{display:inline-block}
  .err{min-height:0;margin:0;font-size:12.5px;color:var(--err);opacity:0;
    transition:opacity .15s;line-height:1.4;text-align:center}
  .err.show{opacity:1;margin:11px 2px 0}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .foot{position:relative;z-index:1;padding:0 24px 28px;text-align:center;font-size:11px;
    color:var(--foot);line-height:1.85}
  .foot a{color:var(--foot-a);text-decoration:none;border-bottom:1px solid var(--line)}
  .foot a:hover{color:var(--ink)}
  #content[hidden]{display:none}
  #content{background:var(--content-bg);min-height:100%}
</style>
</head>

<script>
  var GATE_KEY = "st2sheet_pw";

  function b64ToBytes(b64){const s=atob(b64);const a=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function deriveKey(pw,salt,iter){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),
      {name:"PBKDF2"},false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }
  async function decryptPayload(pw){
    const blob=JSON.parse(document.getElementById("payload").textContent);
    const key=await deriveKey(pw,b64ToBytes(blob.salt),blob.iterations);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(blob.iv)},key,b64ToBytes(blob.ciphertext));
    return new TextDecoder().decode(pt);
  }
  function reveal(html){
    var c=document.getElementById("content");
    c.innerHTML=html;
    document.getElementById("gate").style.display="none";
    var ps=document.getElementById("pg-style");if(ps)ps.disabled=true;
    c.hidden=false;
    document.body.classList.remove("locked");
    if(typeof window.onGateUnlock==="function"){try{window.onGateUnlock(c);}catch(e){}}
    c.querySelectorAll("script").forEach(function(old){
      var s=document.createElement("script");
      for(const a of old.attributes)s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;old.replaceWith(s);
    });
  }
  function showErr(m){var e=document.getElementById("err");e.textContent=m;e.classList.add("show");
    var f=document.querySelector(".card");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");}
  function clearErr(){document.getElementById("err").classList.remove("show");}

  async function gateSubmit(ev){
    ev.preventDefault();clearErr();
    var pw=document.getElementById("pw").value;
    if(!pw)return false;
    document.body.classList.add("busy");
    document.querySelector(".enter").disabled=true;
    try{
      var html=await decryptPayload(pw);
      if(document.getElementById("remember").checked)localStorage.setItem(GATE_KEY,pw);
      reveal(html);
    }catch(e){
      document.body.classList.remove("busy");
      document.querySelector(".enter").disabled=false;
      showErr("That password is not correct.");
      var i=document.getElementById("pw");i.value="";i.focus();
    }
    return false;
  }
  function togglePeek(){
    var i=document.getElementById("pw");
    i.type = i.type==="password" ? "text":"password";
    document.getElementById("eye").style.opacity = i.type==="text" ? ".55":"1";
  }
  function lockDevice(){localStorage.removeItem(GATE_KEY);location.reload();}
  document.getElementById("pw").addEventListener("keyup",function(e){
    var on=e.getModifierState&&e.getModifierState("CapsLock");
    document.getElementById("pg-caps").classList.toggle("on",!!on);
  });

  (async function(){
    var saved=localStorage.getItem(GATE_KEY);
    if(!saved)return;
    try{reveal(await decryptPayload(saved));}
    catch(e){localStorage.removeItem(GATE_KEY);}
  })();
</script>

});

            [4.90,52.37],[55.27,25.20],[139.69,35.69],[151.21,-33.87]];
const HUBV=HUBS.map(([lo,la])=>{
  const p=la/57.29577951,l=lo/57.29577951;
  return [Math.cos(p)*Math.cos(l),Math.sin(p),Math.cos(p)*Math.sin(l)];
});
function slerp(a,b,t){
  let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];d=Math.max(-1,Math.min(1,d));
  const o=Math.acos(d),s=Math.sin(o)||1e-6;
  const k1=Math.sin((1-t)*o)/s,k2=Math.sin(t*o)/s;
  return [a[0]*k1+b[0]*k2,a[1]*k1+b[1]*k2,a[2]*k1+b[2]*k2];
}
const ARCS=[[0,2],[0,3],[0,1],[0,4],[0,5],[1,7]].map(([i,j])=>{
  const p=[];for(let k=0;k<=64;k++){const t=k/64,v=slerp(HUBV[i],HUBV[j],t);
    const lift=1+0.115*Math.sin(Math.PI*t);p.push([v[0]*lift,v[1]*lift,v[2]*lift])}
  return p;
});

const cvs=document.getElementById('globe'), ctx=cvs.getContext('2d');
const off=document.createElement('canvas'), octx=off.getContext('2d');
let W,H,DPR,CX,CY,R;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cvs.width=off.width=W*DPR; cvs.height=off.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); octx.setTransform(DPR,0,0,DPR,0,0);
  if(W>=940){ CX=W*0.345; CY=H*0.50; R=Math.min(W*0.325,H*0.455) }
  else if(W>=940){ CX=W*0.345; CY=H*0.50; R=Math.min(W*0.325,H*0.455) }
  else if(W>=620){ CX=W/2; CY=H*0.54; R=Math.min(W*0.42,H*0.40) }
  else { CX=W/2; CY=H*0.70; R=W*0.56 }
}
addEventListener('resize',resize); resize();

let lam=2.2, phi=0.30, vLam=0, vPhi=0, dragging=false, idle=0, px=0, py=0;
const AUTO=(2*Math.PI)/150;
cvs.addEventListener('pointerdown',e=>{dragging=true;idle=0;px=e.clientX;py=e.clientY;
  cvs.setPointerCapture(e.pointerId);cvs.classList.add('drag')});
cvs.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  const k=1.6/R; vLam=-dx*k; vPhi=dy*k;
  lam+=vLam; phi=Math.max(-1.2,Math.min(1.2,phi+vPhi));
});
function endDrag(e){if(!dragging)return;dragging=false;idle=0;cvs.classList.remove('drag');
  try{cvs.releasePointerCapture(e.pointerId)}catch(_){}}
cvs.addEventListener('pointerup',endDrag);
cvs.addEventListener('pointercancel',endDrag);

function view(v,sl,cl,sp,cp){
  const u= v[0]*cl + v[2]*sl;   // cos(lat)cos(lon-lam): toward the viewer
  const x= v[2]*cl - v[0]*sl;   // cos(lat)sin(lon-lam): east is screen-right
  const y= v[1]*cp - u*sp;
  const Z= v[1]*sp + u*cp;
  return [x,y,Z];
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!dragging){
    lam+=vLam; phi=Math.max(-1.2,Math.min(1.2,phi+vPhi));
    vLam*=0.945; vPhi*=0.945;
    if(Math.abs(vLam)<1e-5)vLam=0; if(Math.abs(vPhi)<1e-5)vPhi=0;
    idle+=dt;
    const ease=Math.min(1,Math.max(0,(idle-1.2)/2.2));
    lam+=AUTO*dt*ease; phi+=(0.30-phi)*Math.min(1,dt*0.22)*ease;
  }
  const sl=Math.sin(lam),cl=Math.cos(lam),sp=Math.sin(phi),cp=Math.cos(phi);
  ctx.clearRect(0,0,W,H);

  // soft brand bloom behind the sphere
  const bl=ctx.createRadialGradient(CX,CY,R*.15,CX,CY,R*1.5);
  bl.addColorStop(0,'rgba(255,0,81,.13)');
  bl.addColorStop(.45,'rgba(120,50,200,.07)');
  bl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bl;ctx.beginPath();ctx.arc(CX,CY,R*1.5,0,6.283);ctx.fill();

  // sphere body: subtle glass so the far side reads as volume
  const bd=ctx.createRadialGradient(CX-R*.35,CY-R*.4,R*.05,CX,CY,R);
  bd.addColorStop(0,'rgba(46,14,78,.88)');
  bd.addColorStop(.55,'rgba(26,4,52,.93)');
  bd.addColorStop(1,'rgba(9,0,22,.97)');
  ctx.fillStyle=bd;ctx.beginPath();ctx.arc(CX,CY,R,0,6.283);ctx.fill();

  // latitude rings
  ctx.lineWidth=1;
  const latStep = 15;
  for(let la=-75;la<=75;la+=latStep){
    const p=la/57.29577951, ry=Math.sin(p), rr=Math.cos(p);
    ctx.beginPath();let st=false;
    for(let d=0;d<=360;d+=4){
      const t=d/57.29577951;
      const v=view([rr*Math.cos(t),ry,rr*Math.sin(t)],sl,cl,sp,cp);
      if(v[2]<=0){st=false;continue}
      const X=CX+v[0]*R, Y=CY-v[1]*R;
      if(!st){ctx.moveTo(X,Y);st=true}else ctx.lineTo(X,Y);
    }
    ctx.strokeStyle='rgba(255,255,255,.10)';ctx.stroke();
  }

  {
    for(let lo=0;lo<360;lo+=15){
      ctx.beginPath();let st=false;
      for(let la=-90;la<=90;la+=3){
        const pp=la/57.29577951, ll=lo/57.29577951, k=Math.cos(pp);
        const v=view([k*Math.cos(ll),Math.sin(pp),k*Math.sin(ll)],sl,cl,sp,cp);
        if(v[2]<=0){st=false;continue}
        const X=CX+v[0]*R, Y=CY-v[1]*R;
        if(!st){ctx.moveTo(X,Y);st=true}else ctx.lineTo(X,Y);
      }
      ctx.strokeStyle='rgba(255,255,255,.09)';ctx.stroke();
    }
  }

  // ---- landmasses, washed with the brand gradient ----
  octx.clearRect(0,0,W,H);
  octx.fillStyle='#fff'; octx.strokeStyle='#fff';
  octx.lineJoin='round'; octx.lineCap='round';
  const paths=[];
  for(let k=0;k<RINGS.length;k++){
    const a=RINGS[k], n=a.length/3;
    let any=false;
    for(let i=0;i<n;i++){
      if(view([a[i*3],a[i*3+1],a[i*3+2]],sl,cl,sp,cp)[2]>0){any=true;break}
    }
    if(!any) continue;                       // wholly on the far side
    const pth=new Path2D();
    for(let i=0;i<n;i++){
      const v=view([a[i*3],a[i*3+1],a[i*3+2]],sl,cl,sp,cp);
      let x=v[0], y=v[1];
      if(v[2]<=0){ const m=Math.hypot(x,y)||1; x/=m; y/=m; }   // ride the limb
      const X=CX+x*R, Y=CY-y*R;
      i?pth.lineTo(X,Y):pth.moveTo(X,Y);
    }
    pth.closePath(); paths.push(pth);
  }
  octx.globalAlpha=0.075; for(const q of paths) octx.fill(q);   // faint body
  octx.globalAlpha=0.085; octx.lineWidth=2.4;                    // soft halo
  for(const q of paths) octx.stroke(q);
  octx.globalAlpha=0.42;  octx.lineWidth=0.75;                   // contour, not an edge
  for(const q of paths) octx.stroke(q);
  octx.globalAlpha=1;
  // brand gradient through the land silhouette
  octx.globalCompositeOperation='source-in';
  const gd=octx.createLinearGradient(CX-R,CY-R,CX+R*0.9,CY+R);
  gd.addColorStop(0,   '#ffd3e2');
  gd.addColorStop(0.20,'#ff86ae');
  gd.addColorStop(0.44,'#ff2e6d');
  gd.addColorStop(0.66,'#f5005a');
  gd.addColorStop(0.85,'#c02a8f');
  gd.addColorStop(1,   '#7c4ddb');
  octx.fillStyle=gd; octx.fillRect(0,0,W,H);
  octx.globalCompositeOperation='source-over';
  ctx.save();
  ctx.beginPath(); ctx.arc(CX,CY,R,0,6.283); ctx.clip();
  ctx.drawImage(off,0,0,W,H);
  // sphere volume: flat fills alone read as a sticker, so shade toward the far side
  const shade=ctx.createRadialGradient(CX-R*0.42,CY-R*0.46,R*0.06,CX,CY,R*1.02);
  shade.addColorStop(0,'rgba(255,255,255,.05)');
  shade.addColorStop(.55,'rgba(0,0,0,0)');
  shade.addColorStop(1,'rgba(10,0,26,.42)');
  ctx.fillStyle=shade; ctx.beginPath(); ctx.arc(CX,CY,R,0,6.283); ctx.fill();
  ctx.restore();

  // corridor arcs, restrained
  const deco = true;
  ctx.lineWidth=1;
  if(deco) ARCS.forEach((pts,ai)=>{
    ctx.beginPath();let st=false;
    for(const q of pts){
      const v=view(q,sl,cl,sp,cp);
      if(v[2]<=-0.02){st=false;continue}
      const X=CX+v[0]*R, Y=CY-v[1]*R;
      if(!st){ctx.moveTo(X,Y);st=true}else ctx.lineTo(X,Y);
    }
    ctx.strokeStyle='rgba(255,150,190,.20)';ctx.stroke();
    const ph=((now/1000)*0.11+ai*0.17)%1, idx=Math.floor(ph*(pts.length-1));
    for(let k=0;k<10;k++){
      const j=idx-k;if(j<0)continue;
      const v=view(pts[j],sl,cl,sp,cp);if(v[2]<=0.02)continue;
      const X=CX+v[0]*R,Y=CY-v[1]*R,a=(1-k/10)*0.72;
      ctx.fillStyle='rgba(255,214,230,'+a+')';
      ctx.beginPath();ctx.arc(X,Y,1.25,0,6.283);ctx.fill();
    }
  });

  // hub nodes
  const pulse=0.5+0.5*Math.sin(now/900);
  if(deco) for(const hv of HUBV){
    const v=view(hv,sl,cl,sp,cp); if(v[2]<=0.03) continue;
    const X=CX+v[0]*R, Y=CY-v[1]*R, e=Math.min(1,v[2]*2.4);
    const rr=6+pulse*3.2;
    const g=ctx.createRadialGradient(X,Y,0,X,Y,rr);
    g.addColorStop(0,'rgba(255,255,255,'+(0.85*e)+')');
    g.addColorStop(.3,'rgba(255,90,140,'+(0.42*e)+')');
    g.addColorStop(1,'rgba(255,0,81,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,rr,0,6.283);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,'+(0.95*e)+')';
    ctx.beginPath();ctx.arc(X,Y,1.5,0,6.283);ctx.fill();
  }

  // limb
  ctx.strokeStyle='rgba(255,170,205,.26)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(CX,CY,R,0,6.283);ctx.stroke();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function pk(){const i=document.getElementById('pw');i.type=i.type==='password'?'text':'password'}
function demo(e){e.preventDefault();document.getElementById('note').classList.add('show');return false}
</script>
</body>
